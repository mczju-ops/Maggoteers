  # Act4 = 隐藏结局层（2026-10-26 阶段 5「链路验证」占位）。
  # weak/strong 当前 waves_per_act.act4 = 0 波（不会被抽到）；保留非空池是为了内容守护
  # （ActConfigConsistencyTest 要求每层三池齐备）与将来填内容时不用改结构。
  act4:
    weak:
    - strategy: w3_duck_ops
      weight: 2
    strong:
    - strategy: s3_keep_out
      weight: 2
    boss:
