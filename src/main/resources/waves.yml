    # 占位 Boss b4_gatekeeper（凋灵骷髅）已移出池子——它只是链路验证用的占位，
    # 留在池里会有 50% 概率把 Hidden 通关变成"打一只凋灵骷髅"，实测就撞到了。
    - strategy: b4_doorweaver
      weight: 2
