# waveplan implementation (2026-07-26). Single source for strategies and pools.
# delay = step pre-wait seconds; coeff may include hp/dmg/speed/scale/follow_range
# delay = 相对【同 point】上一刷怪时刻的等待秒数（该点尚无事件则相对本轮起点）；不同 point 时间轴独立、可并行
# strategy.repeat = 整份 steps 再跑一轮（每轮各 point 时钟归零，轮起点=上一轮最晚时刻）
# strategy.关卡名称 = Chinese display name (chat begin tip + scoreboard)
# steps[].repeat = 单条 step 在同 point 时间轴上按 delay 再刷几次（默认 1）
# skills: mob_skills.yml 的怪物技能 id 列表（trigger+effect 全可配置；1.1 起替代旧 affixes/infernal）
pools:
  act1:
    weak:
    - strategy: w1_bug_buddies
      weight: 2
    - strategy: w1_patrol_riders
      weight: 2
    - strategy: w1_accident
      weight: 2
    - strategy: w1_symbiosis
      weight: 2
    - strategy: w1_symptom
      weight: 2
    - strategy: w1_herd
      weight: 2
    - strategy: w1_proper_business
      weight: 2
    - strategy: w1_devour
      weight: 2
    strong:
    - strategy: s1_resort_ghosts
      weight: 2
    - strategy: s1_vent_breeze
      weight: 2
    - strategy: s1_maintain_honor
      weight: 2
    boss:
    - strategy: b1_colossus
      weight: 2
    - strategy: b1_eternal_rest
      weight: 2
    # 2026-10-29：b1_bandit_chief（大盗当头）删除，替换为「离歌的庭院」（读条 Boss）
    - strategy: b1_garden_pavilion
      weight: 2
  act2:
    weak:
    - strategy: w2_merchant_convoy
      weight: 2
    - strategy: w2_endless_spear
      weight: 2
    - strategy: w2_fireworks
      weight: 2
    - strategy: w2_lord_legacy
      weight: 2
    - strategy: w2_nest
      weight: 2
    - strategy: w2_territory
      weight: 2
    - strategy: w2_breakthrough
      weight: 2
    - strategy: s2_ice_shadows
      weight: 2
    - strategy: s2_migration
      weight: 2
    - strategy: s2_chessboard
      weight: 2
    strong:
    - strategy: s2_forbidden
      weight: 2
    - strategy: s2_crimson_tunnel
      weight: 2
    # 2026-10-29：s2_controversy（争议频发）删除 → 基础强怪池补 s2_academy（育英圣堂，替代原恶地特色
    # 「本能污染」）。放在基础池而非地图特色池，是为了让 act2.strong **基础条目恒 ≥ 3**
    # （RunPlanner 每层抽 3 条强怪且不许重复；基础池只剩 2 条时，一旦有新地图不带特色波就会开局抛错）。
    - strategy: s2_academy
      weight: 2
    boss:
    - strategy: b2_silent_guard
      weight: 2
    - strategy: b2_breath
      weight: 2
    - strategy: b2_frost_farewell
      weight: 2
    - strategy: b2_musketeers
      weight: 2
  act3:
    weak:
    - strategy: w3_duck_ops
      weight: 2
    - strategy: w3_rabbit_holes
      weight: 2
    - strategy: w3_lights_out
      weight: 2
    strong:
