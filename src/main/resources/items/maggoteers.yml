# 非券种物品（rewardplan 生成）
# ItemCreator 格式；PDC maggoteers:id 供 ItemInteractRouter 识别

maggoteers:revive_coin:
  material: TOTEM_OF_UNDYING
  customName: "<green>复活石"
  lore:
    - "<gray>右键消耗，选择一名玩家，为其添加1次复活机会，若玩家已死亡则将其复活"
    - "<dark_gray>依靠圣器复活石的力量制作的仿制品，似乎能发挥出完全相同的效果。"
  glint: true
  enchantments:
    - minecraft:unbreaking: 10
  pdc:
    - key: maggoteers:kind
      type: STRING
      value: revive_coin

# 隐藏结局层钥匙（Act3 终局休整商店产出；右键进入隐藏层）
maggoteers:hidden_key:
  material: ENDER_EYE
  customName: "<dark_purple>一把钥匙"
  lore:
    - "<gray>右键使用：开启一扇未知的门扉"
    - "<dark_gray>只能在本局第三层终局休整期使用"
  maxStackSize: 1
  glint: true
  enchantments:
    - minecraft:unbreaking: 10
  pdc:
    - key: maggoteers:kind
      type: STRING
      value: hidden_key

# Act4 真·奖杯（不死图腾）：门扉缔造者掉落
maggoteers:true_trophy:
  material: TOTEM_OF_UNDYING
  itemModel: TOTEM_OF_UNDYING
  customName: "<light_purple>真·奖杯"
  lore:
    - "<gray> 你敲开了命运的门扉。"
    - "<dark_gray> 通关隐藏结局；门扉缔造者"
  glint: true
  maxStackSize: 1
  pdc:
    - key: maggoteers:id
      type: STRING
      value: maggoteers:true_trophy

# Act3 Boss 通关纪念：龙蛋
maggoteers:trophy:
  material: RECOVERY_COMPASS
  itemModel: DRAGON_EGG
  customName: "<gold>奖杯"
  lore:
    - "<gray> 独一无二，闪闪发光"
    - "<dark_gray>通关第三层 Boss 的证明"
  glint: true
  enchantments:
    - minecraft:mending: 1
  pdc:
    - key: maggoteers:id
      type: STRING
      value: maggoteers:trophy

# 开局全员探测：半径内波次敌人发光（initial_equipment）
maggoteers:detection_radar:
  material: COMPASS
  customName: "<aqua>探测雷达"
  lore:
    - "<gray>右键使场上所有敌人显形10秒，冷却时间30秒"
    - "<dark_gray>对付隐形敌人最好的方法就是泼油漆桶！"
  maxStackSize: 1
  glint: true
  enchantments:
    - minecraft:unbreaking: 10
  pdc:
    - key: maggoteers:id
      type: STRING
      value: maggoteers:detection_radar
  use_ability:
    cooldown_sec: 30
    effect: BUFF_AREA
    params:
      radius: 64.0
      targets: enemies
      enemy_scope: tracked
      potions:
        - potion: GLOWING
          amp: 0
          duration_ticks: 200
  useCooldown:
    cooldownGroup: "maggoteers:detection_radar"
    seconds: 30

