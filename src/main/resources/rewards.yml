  # ===== 难度负面奖励池（1.3.3；2026-10-28 整理）=====
  # 非玩家抽取池：由 CurseService 进层时按当局难度抽 1 条发给全体在局玩家（附带收藏品）。
  # 困难(HARD)：仅进入 Act2 时从 curse_hard 抽 1 条；专家(EXPERT)：每层分别从 curse_expert_act1/2/3 抽 1 条。
  #
  # 2026-10-28 整理口径（为什么现在是这个样子）：
  #  1. 每个选项要么是**单条 STAT**，要么是**纯 bundle**（自身不写 effect，全部内容放 grants）。
  #     历史坑：老写法"父项带 effect + grants"在 RewardService 里会走 applyBundle 分支，
  #     父项自己的 effect 并不会被应用（绝境·血肉畸变的物攻 -60% 因此一直没生效）。
  #  2. 去重：curse_x2_weak/exhaust/limp/fragile/sharp/awkward 与 curse_hard 的同名条目效果完全重复
  #     （困难只抽 Act2、专家 Act2 也只抽自己那池，二者永不共存），已整体删除；
  #     curse_expert_act2 改用三条新诅咒（屏蔽 / 懦弱 / 贫穷）。
  #  3. display 的数字必须与 params 一致；收藏品（items/collectibles.yml）的 customName / lore 同口径。
  #     "装填速度 -33%" 与 "冷却时间 +50%" 是同一件事（最终冷却 = 基础 / 装填倍率），统一写装填速度。
  #  4. 诅咒池整体放在文件最后，方便一次性审阅。
  curse_hard:
    cost: 0
    options:
      -
        id: curse_hard_weak
