wait:
  min_players: 1
lives:
  default: 2

# 内部测试版开关（正式发布前请改 enabled: false）
# enabled=true：有 maggoteers.play 即可用 /maggoteers debug（无需 OP）
# enabled=false：仅 maggoteers.admin（默认 OP）可用 debug
debug:
  enabled: false
  announce: false
  # 调试探针（/maggoteers debug aura的逐条输出）。默认关闭，排查时再开会刷日志。
  probe: false

# 全局怪物属性倍率（再叠 waves.yml coeff / affixes）
mob_attributes:
  scale: 1.0
  follow_range: 10.0
  squad_target_range: 32.0
  squad_move_speed: 1.0
  squad_horse_speed: 2.5   # 马/骆驼专属中间档（替代旧 squad_charge_speed 4.0：4.0 太快、1.0 太慢 → 2.5）

# 局内怪物行为规则
mob_rules:
  # 禁止本局刷出的蜘蛛 / 洞穴蜘蛛爬墙：
  block_spider_wall_climb: true
  # 拦下本局刷出的潜影贝的传送
  block_shulker_teleport: true

initial_equipment:
  - maggoteers:detection_radar   # 开局全员探测雷达；职业装仍由 class 池发放
class_select:
  timeout_sec: 45

# 可升级 STAT（stack: UPGRADE_LEVEL）的等级上限：option upgrade_max → 池级 upgrade_level_cap → 本默认值
rewards:
  upgrade_level_cap_default: 4

# 管理员可自定义：名称(MiniMessage)、材质、描述、光效
# item_id 须与 waves.yml clearReward / rewards.yml 中引用一致
items:
  currency_normal:
    item_id: maggoteers:currency_normal
    kind: currency_normal
    material: GOLD_NUGGET
    name: "<yellow>金币"
    lore:
      - "<gray>可用于在商店购买技能和物品"
    glint: true
  currency_boss:
    item_id: maggoteers:currency_boss
    kind: currency_boss
    material: NETHER_STAR
    name: "<light_purple>星石"
    lore:
      - "<gray>可用于在Boss商店购买物品"
    glint: true
  class_ticket:
    item_id: maggoteers:class_ticket
    kind: class_ticket
    material: WRITABLE_BOOK
    name: "<gold>职业选择券"
    lore:
      - "<gray>开局选择职业专用"
      - "<dark_gray>右键重新打开职业菜单"
    glint: true
  shop_emerald:
    item_id: maggoteers:shop_emerald
    kind: shop_emerald
    material: EMERALD
    name: "<green>休整菜单"
    lore:
      - "<gray>右键打开休整期菜单"
      - "<dark_gray>商店与投票跳过休整功能"
    glint: true

# 局内奖励物品丢弃/放入容器保护（false = 允许丢弃）
run_items:
  drop_protection: false

# 层列表（顺序即推进顺序）——层数的唯一真相源。
# 加一层 = 这里加 id + 配 act_origins.<id> + waves_per_act.<id> + maps/<id>/ + waves.yml pools.<id>
# 缺任一项会在开局生成剧本时直接报错
acts: [act1, act2, act3, act4]

# 隐藏结局层（2026-10-26 阶段 5「链路验证」）：
#   hidden_act:        隐藏层 id（必须已写进上面的 acts:）；留空 = 无隐藏层，行为与旧版完全一致
#   hidden_gate_after: 清掉这一层的 **Boss 波** 后进入"终局休整"，此时才允许用钥匙进门；
#                      休整结束/全员跳过 → 正常通关（不进门），只有主动用钥匙才会进隐藏层
hidden_act: act4
hidden_gate_after: act3
# 层特例规则（原先写死在 Java 里，等价于"只有第 3 层特殊"）。改为显式层 id 列表：
#   shop_always_strong: 该层普通商店恒抽 strong 池（不看上一波档位）
#   boss_pool_early:    该层清掉 weak（奖励关）后即把 Boss 池粘滞切到本层
#   curse_hard:         困难难度在这些层发放 curse_hard
#   curse_expert:       专家难度在这些层发放 curse_expert_<层id>
act_rules:
  shop_always_strong: []
  boss_pool_early: []
  curse_hard: [act2]
  curse_expert: [act1, act2, act3]
act_origins:
  act1: [0, 64, 0]
  act2: [1024, 64, 0]
  act3: [2048, 64, 0]
  act4: [3072, 64, 0]
waves_per_act:
  act1: { weak: 3, strong: 3 }
  act2: { weak: 3, strong: 3 }
  act3: { weak: 1, strong: 4 }
  # Act4 占位（链路验证）：单波 Boss 战，不刷杂兵波；池子仍保留三条（内容守护要求非空）
  act4: { weak: 0, strong: 0 }  
rest:
  duration_sec: 60
map:
  fallback_platform: true
world:
  time_lock: night   # night | day | midnight | none
player:
  night_vision: true   # 玩家夜视
act_enter:
  prep_sec: 10       # 每层地图粘贴后、开波前的准备倒计时（秒）

# 魔法武器右键释放：音效 + 粒子预设（handler 内调用 MagicFxService.play）
# preset: THICK_RING | SPIRAL_RADIUS | RIPPLE_RINGS | AIM_RAY | SMOOTH_EXPAND_RING | DOT_ABOVE
# particle: FLAME, SOUL_FIRE_FLAME, CRIT, ENCHANT, ELECTRIC_SPARK, END_ROD, …（见 GameRegistries.particle）
# AURA 携带者脚下粒子：每次 play 为完整单次动画；间隔内不重复触发
aura:
  carrier_fx:
    default_interval_sec: 3
    by_preset:
      SMOOTH_EXPAND_RING: 5
      THICK_RING: 1

# 氛围音效 + 大字广播（进层/波次开始/boss 波，全部可配置）
# sound: 原版 Sound 枚举名（免下载）
# title: MiniMessage 模板，{name}=关卡名；留空 = 不广播标题（<bold> 即黑体）
# title_times: 标题淡入/停留/淡出（tick）
# repeat: 连播次数；repeat_gap_ticks: 每次间隔（tick）
ambience:
  enter_act:
    sound: AMBIENT_CAVE
    volume: 1.0
    pitch: 1.0
    title: "<bold><white>！？区区恶敌？！"
    title_times: { fade_in: 5, stay: 45, fade_out: 10 }
  wave_start:
    sound: ENTITY_WARDEN_HEARTBEAT
    volume: 1.0
    pitch: 1.0
  boss_start:
    sound: ENTITY_WARDEN_EMERGE
    volume: 1.0
    pitch: 1.0
    title: "<bold><white>{name}"
    title_times: { fade_in: 5, stay: 60, fade_out: 10 }
  final_boss:
    sound: BLOCK_END_PORTAL_SPAWN
    repeat: 3
    repeat_gap_ticks: 12
    volume: 1.0
    pitch: 1.0
    title: "<bold><white>{name}"
    title_times: { fade_in: 5, stay: 80, fade_out: 15 }
  victory:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
    title: "<bold><gold>胜利"
    title_times: { fade_in: 8, stay: 90, fade_out: 25 }

magic_fx:
  defaults:
    sound: ENTITY_PLAYER_ATTACK_SWEEP
    sound_volume: 0.9
    sound_pitch: 1.05
    preset: THICK_RING
    particle: FLAME
    radius: 4.5
    ray_length: 12.0
    density: 64
    ripple_rings: 4
    expand_steps: 28
    spiral_ticks: 18
  # 按 use_ability.effect 自动套用（可被 magic_fx.weapons 与 use_ability.fx 覆盖）
  templates:
    heal:
      preset: RIPPLE_RINGS
      particle: HAPPY_VILLAGER
      radius: 5.0
      ripple_rings: 4
      sound: ENTITY_EXPERIENCE_ORB_PICKUP
      sound_volume: 0.75
      sound_pitch: 1.35
    beam:
      preset: NONE
      particle: END_ROD
      ray_length: 32.0
      sound: ENTITY_ILLUSIONER_CAST_SPELL
      sound_volume: 0.85
      sound_pitch: 1.15
      density: 48
    buff:
      preset: NONE
      particle: ENCHANT
      sound: BLOCK_ENCHANTMENT_TABLE_USE
      sound_volume: 0.7
      sound_pitch: 1.25
  weapons:
    maggoteers:test_blade:
      preset: SPIRAL_RADIUS
      radius: 6.0
      particle: CRIT
      sound: ENTITY_PLAYER_ATTACK_SWEEP
      sound_volume: 0.9
      sound_pitch: 1.1
      density: 48
      spiral_ticks: 44
    maggoteers:excalibur_a3:
      particle: END_ROD
      ray_length: 32.0
      sound: ENTITY_ILLUSIONER_CAST_SPELL
      density: 64
scaling:
  mob_hp:        [1.0, 1.5, 2.0, 3.0]
  mob_damage:    [1.0, 1.1, 1.2, 1.3]
  mob_count:     [1.0, 1.0, 1.1, 1.2]
  # mob_speed:    [1.0, 1.0, 1.0, 1.0]   # 预留：未来 affix 速度扩展；当前速度缩放不生效，取消注释即启用
# 难度分级（1.3.3）：普通/困难/专家。房主等待阶段 /maggoteers difficulty <n> 选择。
# 倍率乘在 scaling 人数数组之上（mob_speed 无难度倍率，保持人数数组原值）。
difficulty:
  multipliers:
    normal: { mob_hp: 1.0,  mob_damage: 1.0,  mob_count: 1.0 }
    hard:   { mob_hp: 1.2,  mob_damage: 1.15, mob_count: 1.1 }
    expert: { mob_hp: 1.3,  mob_damage: 1.25, mob_count: 1.2 }
settlement:
  win_flat: 100
  fail_per_act: 25
  fail_per_wave: 1
  difficulty_multipliers:
    normal: 1.0
    hard: 1.25
    expert: 1.5

